<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--
      An end-repeat sign, generated by tools/make-icons.mjs. Written with
      absolute paths so Vite rewrites them against the relative base; see
      vite.config.ts for why the base is relative at all.

      .ico first and .svg second is the order that works out: browsers
      that understand image/svg+xml prefer the declared type, and the
      rest fall back past it. The .ico also answers the unprompted
      /favicon.ico request, which this host otherwise serves index.html
      for, with a 200.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- pre-JS fallback only: boot overwrites this from src/config.ts -->
    <title>Passagework</title>
    <meta
      name="description"
      content="Loop a short passage against its score, at any tempo, without letting go of your instrument. No account, no upload — your recordings never leave your machine."
    />

    <!--
      The old pages.dev address still serves this same build and always
      will, so without this there are two live URLs for one page. This
      names which one is the site. Crawlers follow it: a link shared as
      pages.dev resolves to the card below rather than a second identity.
    -->
    <link rel="canonical" href="https://passagework.us/" />

    <!--
      Link previews. These have to be static: the crawlers that build a
      preview card do not run JavaScript, so nothing the app sets at
      runtime is ever seen. Without them a shared link unfurls to a bare
      rectangle holding one word.

      The canonical above and og:url/og:image below are the only absolute
      URLs in the project, and they have to be — the spec requires it and
      crawlers do not resolve relative ones reliably. So this is the one
      file that knows where the app is deployed, and moving again means
      editing these three lines. Everything else stays relative (see
      vite.config.ts).

      The card itself is public/og.png, drawn by tools/og-card.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Passagework" />
    <meta property="og:title" content="Passagework" />
    <!--
      Shorter than the meta description above, and deliberately so. That
      one is read by search engines, which show about 160 characters; this
      one is read by whatever renders a link preview, where a single line
      is the whole budget. LinkedIn's own card does not print it at all —
      image, title, domain, nothing else — so it is really working for
      Slack, Discord and iMessage.

      Post Inspector warns about descriptions under 100 characters. That
      is advice about search copy, not a rule about cards, and it is not
      worth padding a preview line to satisfy.

      The card image already carries the full tagline, so repeating every
      word of it here would only say the same thing twice.
    -->
    <meta
      property="og:description"
      content="Loop a short passage against its score, at any tempo, hands-free."
    />
    <meta property="og:url" content="https://passagework.us/" />
    <meta property="og:image" content="https://passagework.us/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Passagework wordmark under a musical repeat sign, gold on a dark ground."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
